name: CI / CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Original console regression tests
        run: |
          mkdir -p .local/legacy-classes
          javac -encoding UTF-8 -d .local/legacy-classes legacy-console/*.java legacy-console/tests/RegressionTests.java
          java -cp .local/legacy-classes RegressionTests
      - name: Build production image and run Maven verify
        run: docker build --tag campus-pantry-api:ci backend

  database:
    name: PostgreSQL constraints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pantry_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pantry_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: pantry_test
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Auth schema fixture
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          SQL
      - name: Apply migration, demo fixtures and constraint checks
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/migration/V1__pantry_schema.sql
          psql -v ON_ERROR_STOP=1 -f backend/db/demo-seed.sql
          psql -v ON_ERROR_STOP=1 -f backend/db/verify-constraints.sql

  mobile:
    name: Expo checks and bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bootstrap dependency lock
        run: npm install --no-audit --no-fund
      - name: Capture dependency lock for source control
        run: node -e "console.log('PANTRY_LOCK_GZIP:' + require('zlib').gzipSync(require('fs').readFileSync('package-lock.json')).toString('base64'))"
      - run: npm run typecheck
      - run: npm run check:expo
      - name: Bundle iOS, Android and web
        run: npx expo export --platform all

  ci:
    name: CI passed
    if: ${{ always() }}
    needs: [backend, database, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          BACKEND: ${{ needs.backend.result }}
          DATABASE: ${{ needs.database.result }}
          MOBILE: ${{ needs.mobile.result }}
        run: |
          test "$BACKEND" = success
          test "$DATABASE" = success
          test "$MOBILE" = success

  deploy:
    name: Deploy validated main to Render
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RENDER_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: render-production
      cancel-in-progress: false
    steps:
      - name: Trigger deployment of the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo 'Missing production deploy hook.'; exit 1; }
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'A newer commit is on main; skipping this obsolete deployment.'
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" --output /tmp/render-deploy.json
          echo 'Render accepted the deployment request; rollout and health must be checked in Render.'
