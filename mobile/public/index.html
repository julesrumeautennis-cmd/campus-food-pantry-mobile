<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pantry" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#003525" />
    <style id="expo-reset">
      html, body { height: 100%; }
      body { margin: 0; overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
      @supports (height: 100dvh) { #root { height: 100dvh; } }
      @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
        #pantry-tabs {
          background-color: rgba(255, 255, 255, .79);
          -webkit-backdrop-filter: saturate(155%) blur(20px);
          backdrop-filter: saturate(155%) blur(20px);
        }
      }
      @media (prefers-reduced-transparency: reduce) { #pantry-tabs { background: white; } }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to use Campus Food Pantry.</noscript>
    <div id="root"></div>
  </body>
</html>
