# Set PORT=8080 in Vercel project settings so ingress matches the container.
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Bounded pools per instance; Supabase's session pooler supplies the JDBC endpoint.
server.tomcat.threads.max=24
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=128
server.tomcat.accept-count=32
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
pantry.cors-origins=${CORS_ORIGINS:}
