server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.application.name=campus-pantry-api
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.flyway.enabled=${RUN_MIGRATIONS:false}
spring.flyway.schemas=pantry
spring.flyway.default-schema=pantry
pantry.auth.issuer=${SUPABASE_URL}/auth/v1
pantry.auth.jwks=${SUPABASE_URL}/auth/v1/.well-known/jwks.json
pantry.admin-user-id=${ADMIN_USER_ID:}
pantry.cors-origins=${CORS_ORIGINS:http://localhost:8081}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
